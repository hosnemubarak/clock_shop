{% extends 'base_error.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center mt-5">
            <div class="mb-4">
                <i class="las la-server text-danger icon-120" ></i>
            </div>
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h3 class="text-uppercase mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">
                Something went wrong on our end. Please contact the developer team for assistance.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-primary">
                    <i class="las la-home me-1"></i> Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
