{% extends 'base.html' %}

{% block title %}Page Not Found | {{ SHOP_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center mt-5">
            <div class="mb-4">
                <i class="las la-search text-info icon-120" ></i>
            </div>
            <h1 class="display-1 fw-bold text-info">404</h1>
            <h3 class="text-uppercase mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <div class="d-flex justify-content-center gap-2 mb-4">
                <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
                    <i class="las la-home me-1"></i> Dashboard
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="las la-arrow-left me-1"></i> Go Back
                </a>
            </div>
            <div class="mt-4 pt-3 border-top">
                <h5 class="fs-15 text-muted mb-3">Quick Links</h5>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <a href="{% url 'sales:sale_create' %}" class="btn btn-soft-success btn-sm"><i class="las la-cart-plus me-1"></i>New Sale</a>
                    <a href="{% url 'inventory:item_list' %}" class="btn btn-soft-info btn-sm"><i class="las la-box me-1"></i>Inventory</a>
                    <a href="{% url 'customers:customer_list' %}" class="btn btn-soft-primary btn-sm"><i class="las la-users me-1"></i>Customers</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
