{% load static %}
<!doctype html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="light" data-sidebar-size="lg" data-sidebar-image="none" data-preloader="disable">

<head>
    <meta charset="utf-8" />
    <title>Page Not Found | {{ SHOP_NAME|default:"Clock Shop" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Page Not Found" name="description" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">

    <!-- Bootstrap Css -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="{% static 'css/app.min.css' %}" rel="stylesheet" type="text/css" />
</head>

<body class="auth-bg 100-vh">
    <div class="bg-overlay bg-light"></div>

    <div class="account-pages">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="text-center d-flex flex-column justify-content-center min-vh-100 py-5">
                        <div class="mb-4">
                            <i class="las la-search text-info" style="font-size: 100px;"></i>
                        </div>
                        <h1 class="display-1 fw-bold text-info">404</h1>
                        <h3 class="text-uppercase mb-3">Page Not Found</h3>
                        <p class="text-muted mb-4">
                            The page you're looking for doesn't exist or has been moved.
                        </p>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'dashboard' %}" class="btn btn-primary">
                                <i class="las la-home me-1"></i> Dashboard
                            </a>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                <i class="las la-arrow-left me-1"></i> Go Back
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
